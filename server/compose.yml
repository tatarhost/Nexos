services:
  nexus-inference:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-8000}:8000"
    environment:
      NEXUS_API_TOKEN: ${NEXUS_API_TOKEN:?Set a long random NEXUS_API_TOKEN in .env}
      NEXUS_DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://tatarhost.github.io}
    volumes:
      - nexus-models:/data
volumes:
  nexus-models:
